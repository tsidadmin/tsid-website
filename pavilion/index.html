<style>
/* Layout: full-bleed WebGL night pavilion; dark glass HUD pinned to the edges — logo top-left, actions top-right, service rail along the bottom, detail card right (bottom sheet on phones). Single dark look by design. */
:root{
  --bg:#04060C; --glass:rgba(8,13,26,.74); --glass-2:rgba(12,20,38,.82); --line:rgba(120,190,255,.16);
  --text:#EAF2FF; --muted:#93A3BE; --dim:#5D6E8C;
  --cyan:#22E5FF; --blue:#3D7BFF; --violet:#8B5CF6; --magenta:#E040FB; --accent:var(--cyan); --accent-2:var(--blue);
  --sans:Inter, Helvetica, Arial, sans-serif; --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased;}
#stage{position:fixed;inset:0;}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;}
#stage canvas.drag{cursor:grabbing;} #stage canvas.hot{cursor:pointer;}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(2,3,8,.55) 100%);}

.hud{position:fixed;z-index:5;pointer-events:none;}
.hud > *{pointer-events:auto;}
.top{top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));}
.brand{display:flex;align-items:center;gap:16px;}
.brand img{width:118px;height:auto;display:block;filter:drop-shadow(0 0 12px rgba(34,229,255,.25));}
.brand .tag{font:500 11px/1.5 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);max-width:28ch;border-left:1px solid var(--line);padding-left:16px;}
.brand .tag b{color:var(--cyan);font-weight:500;}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
.btn{font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line);background:var(--glass);color:var(--text);
  padding:12px 14px;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:2px;text-decoration:none;display:inline-flex;align-items:center;transition:border-color .2s,box-shadow .2s,color .2s;}
.btn:hover{border-color:var(--cyan);box-shadow:0 0 18px rgba(34,229,255,.25);color:#fff;}
.btn.solid{background:linear-gradient(90deg,rgba(34,229,255,.18),rgba(224,64,251,.18));border-color:rgba(34,229,255,.45);}
.btn[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan);}
.btn:focus-visible,.chip:focus-visible,.card a:focus-visible,.nav button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}

.index{bottom:0;left:0;right:0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));}
.rail{display:flex;gap:20px;overflow-x:auto;background:var(--glass);border:1px solid var(--line);padding:10px 12px;scrollbar-width:thin;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:2px;}
.group{display:flex;align-items:center;gap:6px;flex:none;}
.group .lbl{font:500 10px/1 var(--mono);letter-spacing:.22em;color:var(--dim);margin-right:4px;}
.group .lbl.build{color:var(--cyan);} .group .lbl.grow{color:var(--magenta);}
.chip{font:400 12.5px/1 var(--sans);color:#C3CFE3;background:rgba(255,255,255,.02);border:1px solid var(--line);padding:8px 10px;cursor:pointer;white-space:nowrap;border-radius:2px;transition:all .2s;}
.chip:hover{border-color:rgba(34,229,255,.5);color:#fff;}
.chip.grow:hover{border-color:rgba(224,64,251,.5);}
.chip.on{background:rgba(34,229,255,.14);border-color:var(--cyan);color:#fff;box-shadow:0 0 14px rgba(34,229,255,.3) inset;}
.chip.grow.on{background:rgba(224,64,251,.14);border-color:var(--magenta);box-shadow:0 0 14px rgba(224,64,251,.3) inset;}
.hint{font:400 11px/1 var(--mono);color:var(--dim);letter-spacing:.06em;margin:0 0 8px 2px;}

.card{position:fixed;z-index:6;right:max(16px, env(safe-area-inset-right,0px));top:calc(84px + env(safe-area-inset-top,0px));
  width:min(380px, calc(100vw - 32px));max-height:calc(100% - 200px);overflow:auto;background:var(--glass-2);border:1px solid var(--line);padding:24px 24px 18px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:2px;transition:opacity .35s ease, transform .35s ease;}
.card::before{content:"";position:absolute;left:0;top:0;height:2px;width:100%;background:linear-gradient(90deg,var(--accent),transparent);}
.card[data-p="grow"]{--accent:var(--magenta);--accent-2:var(--violet);}
.card[data-p="atrium"]{--accent:var(--cyan);}
.card.out{opacity:0;transform:translateY(8px);pointer-events:none;}
.eyebrow{font:500 10.5px/1.4 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0 0 12px;}
.card h1{font:300 28px/1.12 var(--sans);letter-spacing:-.01em;margin:0 0 14px;text-wrap:balance;color:#fff;}
.card p{font-size:14px;line-height:1.62;color:var(--muted);margin:0 0 16px;}
.work{list-style:none;margin:0 0 18px;padding:0;border-top:1px solid var(--line);}
.work li{font-size:13px;color:#C9D4E6;padding:8px 0 8px 18px;border-bottom:1px solid var(--line);position:relative;}
.work li::before{content:"";position:absolute;left:2px;top:14px;width:6px;height:6px;background:var(--accent);box-shadow:0 0 8px var(--accent);}
.links{display:flex;flex-direction:column;align-items:flex-start;gap:12px;}
.more{font:400 12px/1.3 var(--mono);letter-spacing:.04em;color:var(--muted);text-decoration:none;}
.more:hover{color:#fff;}
.cta{display:inline-block;font:500 12px/1 var(--mono);letter-spacing:.06em;color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent);padding-bottom:4px;}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:14px;border-top:1px solid var(--line);}
.nav button{font:500 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;background:none;border:none;color:var(--muted);cursor:pointer;padding:6px 0;}
.nav button:hover{color:#fff;}
.nav .count{font:400 11px/1 var(--mono);color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.1em;}
.toast{position:fixed;z-index:9;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--glass-2);border:1px solid var(--cyan);color:var(--text);
  font-size:13px;line-height:1.5;padding:12px 16px;max-width:min(440px, calc(100vw - 32px));backdrop-filter:blur(12px);}
#veil{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-items:center;transition:opacity .9s ease;}
#veil.gone{opacity:0;pointer-events:none;}
#veil .in{text-align:center;display:grid;gap:18px;justify-items:center;}
#veil img{width:150px;}
#veil span{font:500 10.5px/1 var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--cyan);}
#veil .bar{width:160px;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);animation:sweep 1.6s ease-in-out infinite;}
@keyframes sweep{0%,100%{opacity:.25}50%{opacity:1}}

/* film overlays (video capture only) */
.film-only{display:none;}
body.film .hud, body.film .card, body.film .toast{display:none!important;}
body.film .film-only{display:block;}
#fcap{position:fixed;left:0;right:0;bottom:0;padding:16vmin 7vmin 8vmin;background:linear-gradient(to top,rgba(4,6,12,.92) 0%,rgba(4,6,12,.6) 50%,rgba(4,6,12,0) 100%);opacity:0;--accent:var(--cyan);}
#fcap[data-p="grow"]{--accent:var(--magenta);}
#fcapE{font:500 1.6vmin/1.3 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin:0 0 1.6vmin;text-shadow:0 0 12px var(--accent);}
#fcapT{font:300 5.6vmin/1.06 var(--sans);letter-spacing:-.01em;color:#fff;margin:0 0 1.4vmin;max-width:22ch;}
#fcapL{font:400 2.2vmin/1.4 var(--sans);color:var(--muted);margin:0;}
#fintro{position:fixed;left:0;right:0;bottom:9vmin;text-align:center;opacity:0;}
#fintro img{width:24vmin;margin:0 auto;filter:drop-shadow(0 0 2vmin rgba(34,229,255,.35));}
#fintro p{font:500 1.5vmin/1 var(--mono);letter-spacing:.32em;text-transform:uppercase;color:var(--cyan);margin:2.4vmin 0 0;}
#fend{position:fixed;inset:0;background:rgba(4,6,12,.93);opacity:0;}
#fend .in{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;gap:2.8vmin;padding:0 8vmin;}
#fend img{width:36vmin;filter:drop-shadow(0 0 2.4vmin rgba(34,229,255,.35));}
#fend h2{font:200 6vmin/1.1 var(--sans);margin:0;color:#fff;max-width:16ch;letter-spacing:-.01em;}
#fend .e{font:500 1.6vmin/1 var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--magenta);}
#fend .u{font:500 2.2vmin/1 var(--mono);letter-spacing:.14em;color:var(--cyan);border-top:1px solid var(--line);padding-top:2.4vmin;}

@media (max-width:720px){
  .brand .tag{display:none;} .brand img{width:96px;}
  .btn{padding:9px 10px;font-size:10px;}
  .card{top:auto;bottom:calc(64px + env(safe-area-inset-bottom,0px));left:max(16px, env(safe-area-inset-left,0px));right:max(16px, env(safe-area-inset-right,0px));width:auto;max-height:none;overflow:visible;padding:16px 18px 12px;}
  .card .work{display:none;} .card h1{font-size:23px;} .card p{font-size:13.5px;margin-bottom:12px;} .eyebrow{margin-bottom:8px;} .nav{margin-top:12px;padding-top:10px;}
  .hint{display:none;}
}
@media (prefers-reduced-motion:reduce){.card,#veil{transition:none;} #veil .bar{animation:none;}}
</style>

  const rt=new THREE.WebGLRenderTarget(size.x,size.y,{type:isGL2?THREE.HalfFloatType:THREE.UnsignedByteType,format:THREE.RGBAFormat,minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter});

  bloom=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),FILM?0.95:0.85,0.55,isGL2?0.92:0.78);composer.addPass(bloom);
  if(isGL2){[bloom.renderTargetBright,...bloom.renderTargetsHorizontal,...bloom.renderTargetsVertical].forEach(r=>{r.texture.type=THREE.HalfFloatType;});}
  composer.addPass(new THREE.ShaderPass({uniforms:{tDiffuse:{value:null}},
    vertexShader:"varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}",
    fragmentShader:"uniform sampler2D tDiffuse;varying vec2 vUv;float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}"+
      "void main(){vec3 c=max(texture2D(tDiffuse,vUv).rgb,0.0);vec3 lo=c*12.92;vec3 hi=1.055*pow(c,vec3(1.0/2.4))-0.055;vec3 s=mix(lo,hi,step(vec3(0.0031308),c));"+
      "s+=(h(gl_FragCoord.xy)+h(gl_FragCoord.yx+0.37)-1.0)/255.0;gl_FragColor=vec4(s,1.0);}"}));
  fxaa=new THREE.ShaderPass(THREE.FXAAShader);fxaa.uniforms.resolution.value.set(1/(innerWidth*PR),1/(innerHeight*PR));composer.addPass(fxaa);
}

  c.addEventListener("selectstart",()=>{tmpM.identity().extractRotation(c.matrixWorld);ray.ray.origin.setFromMatrixPosition(c.matrixWorld);ray.ray.direction.set(0,0,-1).applyMatrix4(tmpM);
    const h=ray.intersectObjects(hitBoxes,false)[0];if(h){go(h.object.userData.idx);return;}
    const f=ray.intersectObject(floorMesh,false)[0];if(f){const p=f.point.clone();collide(p);rig.position.set(p.x,0,p.z);active=null;}});
  rig.add(c);}}

/* ================= per-frame scene motion ================= */
function animateScene(t){
  for(const st of stations){st.sculpt.u(t);st.panelG.position.y=4.3+Math.sin(t*0.8+st.deg)*0.04;}
  bigSprig.rotation.y=Math.sin(t*0.25)*0.35;bigSpark.rotation.y=t*0.6;bigSpark.position.y=7.95+Math.sin(t*0.9)*0.08;sparkHalo.position.y=bigSpark.position.y;
  arcs.forEach((a,k)=>a.rotation.z=t*(k%2?-0.35:0.22)*(k+1));
  const sp=(t*0.18)%1;scanDisc.position.y=0.6+sp*4.2;scanDisc.material.opacity=0.14*Math.sin(sp*Math.PI);scanDisc.scale.setScalar(1-sp*0.55);
  const rpa=rgm.attributes.position;rseed.forEach(([a,r,s],i)=>{const q=(t*0.12+s)%1;rpa.setXYZ(i,Math.cos(a+t*0.3)*r*(1-q*0.4),0.6+q*4.4,Math.sin(a+t*0.3)*r*(1-q*0.4));});rpa.needsUpdate=true;
  beams.forEach(b=>b.uniforms.t.value=t);
  pulses.forEach(([pu,p0,p1,i])=>{const q=(t*0.22+i*0.137)%1;pu.position.lerpVectors(p0,p1,q);});
  dust.rotation.y=t*0.012;dust.position.y=Math.sin(t*0.2)*0.15;
  oculus.rotation.z=t*0.1;
}

/* ================= live loop ================= */
const clock=new THREE.Clock();let t=0;
function loop(){
  const dt=Math.min(clock.getDelta(),0.05);t+=dt*(reduce?0.25:1);
  if(glide){glide.t+=dt/glide.dur;const k=ease(Math.min(glide.t,1));rig.position.lerpVectors(glide.from,glide.to,k);yaw=glide.y0+glide.dy*k;pitch=glide.p0+(glide.p1-glide.p0)*k;if(glide.t>=1)glide=null;}
  const f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0),sd=(keys.d?1:0)-(keys.a?1:0),turn=(keys.arrowleft?1:0)-(keys.arrowright?1:0);
  if(turn)yaw+=turn*dt*1.6;
  if(f||sd){const sp=4.2*dt;const p=rig.position;p.x+=(-Math.sin(yaw)*f+Math.cos(yaw)*sd)*sp;p.z+=(-Math.cos(yaw)*f-Math.sin(yaw)*sd)*sp;collide(p);
    if(active!==null){const v=active<0?ATRIUM_VIEW:stations[active];if(p.distanceTo(V(v.spot.x,0,v.spot.z))>3)hideCard();}}
  rig.rotation.y=yaw;
  if(!renderer.xr.isPresenting)camera.rotation.set(pitch,0,0);
  animateScene(t);draw();
}
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;fitFov();renderer.setSize(innerWidth,innerHeight);
  if(composer){composer.setSize(innerWidth,innerHeight);fxaa.uniforms.resolution.value.set(1/(innerWidth*PR),1/(innerHeight*PR));}});

/* ================= film mode (scripted walk-through for video capture) ================= */
function filmSetup(){
  const camR=FILM.camR||8.2,camY=FILM.camY||1.85,lookY=FILM.lookY||3.0;
  const side=FILM.side||0;const lookAt=(deg)=>{const b=deg*D;return V(Math.cos(b)*14-Math.sin(b)*side,lookY,Math.sin(b)*14+Math.cos(b)*side);};
  const view=(deg,drift)=>{const a=(deg+drift)*D;return{pos:V(Math.cos(a)*camR,camY,Math.sin(a)*camR),look:lookAt(deg)};};
  const ANG=S.map(s=>s.deg<180?s.deg+360:s.deg);
  const P0=V(0,12.5,17.2),L0=V(0,1.6,0),P1=V(0,2.5,FILM.introZ||11.5),L1=V(0,FILM.introLook||3.7,0);
  const WIDE=FILM.wide||V(7,10,24.5),WL=V(0,2.2,-2);
  const T0=6.5,STEP=3.0,END=T0+STEP*S.length;
  const cap=$("fcap"),capE=$("fcapE"),capT=$("fcapT"),capL=$("fcapL"),fin=$("fintro"),fend=$("fend");
  const clamp=v=>Math.max(0,Math.min(1,v));
  window.__DUR=END+8.5;
  if(FILM.ambient){window.__DUR=FILM.ambient;window.__frame=function(t){const a=t/FILM.ambient*Math.PI*2;camera.position.set(Math.sin(a)*11.8,3.0+Math.sin(a*2)*0.25,Math.cos(a)*11.8);camera.lookAt(0,2.7,0);animateScene(t);
    cap.style.opacity=0;fin.style.opacity=0;fend.style.opacity=0;draw();};return;}
  window.__frame=function(t){
    let pos,look,ci=-1,cop=0;
    if(t<T0){const k=ease(clamp(t/T0));pos=P0.clone().lerp(P1,k);look=L0.clone().lerp(L1,k);}
    else if(t<END){const k=Math.floor((t-T0)/STEP),lt=(t-T0)-k*STEP,mv=k===0?1.8:1.15;
      if(lt<mv){const e=ease(lt/mv);
        if(k===0){const v=view(ANG[0],0);pos=P1.clone().lerp(v.pos,e);look=L1.clone().lerp(v.look,e);}
        else{const a0=ANG[k-1]+1.6,a1=ANG[k],la=ANG[k-1]+(a1-ANG[k-1])*e;const ca=(a0+(a1-a0)*e)*D;pos=V(Math.cos(ca)*camR,camY,Math.sin(ca)*camR);look=lookAt(la);}}
      else{const v=view(ANG[k],(lt-mv)/(STEP-mv)*1.6);pos=v.pos;look=v.look;}
      ci=k;cop=clamp((lt-mv+0.15)/0.35)*clamp((STEP-0.12-lt)/0.3);}
    else{const lt=t-END,e=ease(clamp(lt/5.2));const v=view(ANG[S.length-1],1.6);pos=v.pos.clone().lerp(WIDE,e);look=v.look.clone().lerp(WL,e);
      const dr=Math.max(0,lt-5.2)*0.012;pos.applyAxisAngle(V(0,1,0),dr);}
    camera.position.copy(pos);camera.lookAt(look);
    animateScene(t);
    stations.forEach((st,i)=>st.topM.opacity=(i===ci&&cop>0.05)?0.5:0.16);
    if(ci>=0){const s=S[ci];capE.textContent="// "+PRACTICE[s.p];capT.textContent=s.t;capL.textContent=s.line;cap.dataset.p=s.p;}
    cap.style.opacity=cop;cap.style.transform="translateY("+((1-cop)*10)+"px)";
    fin.style.opacity=clamp((t-0.4)/0.8)*clamp((4.3-t)/0.7);
    fend.style.opacity=clamp((t-(END+4.6))/1.0);
    draw();
  };
}

/* ================= start ================= */
camera.aspect=innerWidth/innerHeight;fitFov();setupComposer();
const fontsReady=Promise.race([Promise.all([document.fonts.load('300 64px Inter'),document.fonts.load('200 120px Inter'),document.fonts.load('400 28px Inter'),document.fonts.load('500 22px "JetBrains Mono"')]),new Promise(r=>setTimeout(r,2500))]);
if(FILM){
  document.body.classList.add("film");
  fontsReady.catch(()=>{}).finally(()=>{buildTextures();filmSetup();window.__frame(0);window.__ready=true;$("veil").classList.add("gone");});
}else{
  placeAt(ATRIUM_VIEW);showCard(-1);active=-1;
  const fromHash=()=>{const h=(location.hash||"").slice(1).toLowerCase();if(!h)return;const i=S.findIndex(s=>s.k===h);if(i>=0)go(i);else if(h==="atrium")go(-1);};
  addEventListener("hashchange",()=>{const h=(location.hash||"").slice(1);const cur=active!==null&&active>=0?S[active].k:"";if(h&&h!==cur)fromHash();});
  setTimeout(fromHash,900);
  fontsReady.catch(()=>{}).finally(()=>{buildTextures();renderer.setAnimationLoop(loop);requestAnimationFrame(()=>$("veil").classList.add("gone"));});
}
})();
